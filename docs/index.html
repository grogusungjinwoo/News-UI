<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Morning News</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1>Morning News</h1>
      <p id="generatedLine">40 curated articles for the morning brief.</p>
    </div>
    <nav class="nav-controls" aria-label="News controls">
      <button class="icon-button" id="backButton" type="button" title="Back">
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <path d="M15 18l-6-6 6-6"></path>
        </svg>
        <span>Back</span>
      </button>
      <button class="icon-button" id="forwardButton" type="button" title="Forward">
        <span>Forward</span>
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <path d="M9 6l6 6-6 6"></path>
        </svg>
      </button>
      <button class="icon-button refresh-button" id="refreshRandomButton" type="button" title="Refresh Random 10">
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <path d="M21 12a9 9 0 0 1-15.3 6.4"></path>
          <path d="M3 12a9 9 0 0 1 15.3-6.4"></path>
          <path d="M18 2v4h-4"></path>
          <path d="M6 22v-4h4"></path>
        </svg>
        <span>Refresh Random 10</span>
      </button>
    </nav>
  </header>

  <main class="shell">
    <nav class="bucket-nav" id="bucketNav" aria-label="Article buckets"></nav>
    <div id="sections"></div>
  </main>

  <script src="./articles.js" defer></script>
  <script src="./app.js" defer></script>
</body>
</html>
